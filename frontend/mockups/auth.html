<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - NusaNara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Instrument Serif"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: 'hsl(35, 100%, 60%)',
                    }
                }
            }
        }
    </script>
    <style>
        .input-dribbble {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            color: white;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-dribbble:focus {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.05);
            outline: none;
        }
        
        .btn-dribbble {
            background: white;
            color: black;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-dribbble:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.15);
        }

        .btn-dribbble-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-dribbble-outline:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.2);
        }

        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        /* Typography consistent with Hero section */
        .cinematic-heading {
            font-family: 'Instrument Serif', serif;
            line-height: .95;
            letter-spacing: -1.5px;
            font-weight: 400;
        }
    </style>
</head>
<body class="bg-[#050505] text-white min-h-screen font-sans flex overflow-hidden">
    
    <!-- LEFT PANEL: Image & Branding -->
    <div class="hidden lg:flex w-1/2 relative items-center justify-center overflow-hidden p-12 xl:p-20 flex-col bg-black">
        
        <!-- Abstract Generated Background Video -->
        <div class="absolute inset-0 w-full h-full">
            <video autoplay loop muted playsinline class="w-full h-full object-cover">
                <source src="https://res.cloudinary.com/dzyfjpnjg/video/upload/f_auto,q_auto/v1777679367/0219e81c-80bb-4395-a88a-030f78c129cc.mp4_rzl0ls.mp4" type="video/mp4" />
            </video>
            <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-transparent to-transparent"></div>
        </div>
        
        <!-- Noise Overlay -->
        <div class="absolute inset-0 opacity-[0.03] pointer-events-none bg-noise mix-blend-overlay"></div>

        <!-- Content Overlay -->
        <div class="relative z-10 w-full h-full flex flex-col justify-center">
            <div class="max-w-xl">
                <h1 class="cinematic-heading text-white mb-4" style="font-size:clamp(2.5rem,5vw,4.5rem);">
                    Temukan potensi <em class="not-italic" style="color:hsl(240,4%,66%);">Kariermu.</em>
                </h1>
                <p class="text-white/60 text-base font-light max-w-md leading-relaxed">
                    Lebih dari sekadar portal lowongan. Kami memahami narasi Anda dan memetakan lintasan karier masa depan.
                </p>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL: Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 xl:p-24 relative bg-[#07162C]">
        
        <!-- Gold texture overlay -->
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,176,103,0.1),transparent_60%)] pointer-events-none"></div>
        <div class="absolute inset-0 opacity-[0.04] pointer-events-none bg-noise mix-blend-overlay"></div>

        <div class="w-full max-w-[380px] relative z-10">
            
            <!-- Back to home -->
            <a href="index.html" class="inline-flex items-center gap-2 text-white/40 hover:text-white transition-colors text-[10px] uppercase tracking-[0.2em] font-medium group mb-10">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5 group-hover:-translate-x-1 transition-transform"></i>
                Kembali
            </a>

            <div class="mb-10">
                <h2 class="cinematic-heading text-white mb-3" style="font-size:clamp(2.5rem,4vw,3.5rem);">Selamat Datang</h2>
                <p class="text-white/50 text-[13px] font-light">Masukkan detail akun Anda untuk melanjutkan.</p>
            </div>

            <form class="space-y-5">
                <div>
                    <label class="block text-[10px] font-medium tracking-[0.05em] text-white/70 mb-2 uppercase">Email Akademik</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="w-4 h-4 text-white/40"></i>
                        </div>
                        <input type="email" placeholder="nama@kampus.ac.id" class="input-dribbble w-full pl-11 pr-4 py-3.5 rounded-2xl text-[13px] placeholder:text-white/20">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-[10px] font-medium tracking-[0.05em] text-white/70 uppercase">Kata Sandi</label>
                        <a href="#" class="text-[10px] text-white/50 hover:text-white transition-colors">Lupa sandi?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-4 h-4 text-white/40"></i>
                        </div>
                        <input type="password" placeholder="••••••••" class="input-dribbble w-full pl-11 pr-4 py-3.5 rounded-2xl text-[13px] placeholder:text-white/20">
                    </div>
                </div>

                <button type="button" onclick="window.location.href='dashboard.html'" class="btn-dribbble w-full py-3.5 rounded-2xl text-[13px] flex items-center justify-center gap-2 mt-8">
                    Masuk ke Akun
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="flex items-center gap-4 my-8">
                <div class="flex-1 h-[1px] bg-white/10"></div>
                <span class="text-[10px] text-white/40 uppercase tracking-wider">Atau</span>
                <div class="flex-1 h-[1px] bg-white/10"></div>
            </div>

            <button type="button" onclick="window.location.href='dashboard.html'" class="btn-dribbble-outline w-full py-3.5 rounded-2xl text-[13px] font-medium flex items-center justify-center gap-3">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Lanjutkan dengan Google
            </button>
            
            <p class="text-center text-xs text-white/50 mt-10">
                Belum punya akun? <a href="#" class="text-white hover:underline underline-offset-4 transition-colors font-medium">Buat akun baru</a>
            </p>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
