# ============================================================
# Konfigurasi Nginx untuk NusaNara API
# File: /etc/nginx/sites-available/nusanara
#
# Setup:
#   ln -s /etc/nginx/sites-available/nusanara /etc/nginx/sites-enabled/
#   nginx -t
#   systemctl reload nginx
#   certbot --nginx -d api.nusanara-skripsi.my.id
# ============================================================

server {
    listen 80;
    server_name api.nusanara-skripsi.my.id;   # ganti dengan domain kamu

    # Penting untuk streaming SSE agar Nginx tidak buffer response
    proxy_buffering off;
    proxy_cache off;

    # Timeout lebih panjang untuk LLM yang butuh waktu generate
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Diperlukan untuk SSE (Server-Sent Events)
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # Health check endpoint tanpa log (mengurangi noise)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}

# Blok HTTPS akan ditambahkan otomatis oleh Certbot
